name: Firebase Hosting

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-cloudrun-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: podrozowka

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject insecure Firestore rules
        run: |
          if grep -Fq 'allow read, write: if true' firestore.rules; then
            echo 'Firestore rules allow anonymous full read/write access.'
            exit 1
          fi

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Firestore emulator integration tests
        run: bun run test:integration

      - name: Build UAT frontend
        run: |
          VITE_CATALOG_SOURCE=firestore VITE_ENABLE_TEST_DATA_CLEANUP=true VITE_BACKEND_API_URL=https://podrozowka-uat-one.vercel.app bun run build:uat

  deploy:
    name: Deploy Firebase Hosting UAT
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Authenticate to Google Cloud with Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Build Firebase Hosting bundle
        run: |
          bun install --frozen-lockfile
          VITE_CATALOG_SOURCE=firestore VITE_ENABLE_TEST_DATA_CLEANUP=true VITE_BACKEND_API_URL=https://podrozowka-uat-one.vercel.app bun run build:uat

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firebase Hosting
        run: |
          npx --yes firebase-tools@15.28.1 deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only hosting,firestore:rules,firestore:indexes \
            --non-interactive
