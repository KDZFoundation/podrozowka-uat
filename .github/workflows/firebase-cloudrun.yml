name: Firebase Hosting

on:
  pull_request:
    branches: [main]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-cloudrun-${{ github.ref }}
  cancel-in-progress: true

env:
  FIREBASE_PROJECT_ID: podrozowka

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Reject insecure Firestore rules
        run: |
          if grep -Fq 'allow read, write: if true' firestore.rules; then
            echo 'Firestore rules allow anonymous full read/write access.'
            exit 1
          fi

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test

      - name: Build UAT frontend
        run: bun run build

  deploy:
    name: Deploy Firebase Hosting UAT
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Firebase deployment token
        env:
          FIREBASE_TOKEN_UAT: ${{ secrets.FIREBASE_TOKEN_UAT }}
        run: |
          test -n "$FIREBASE_TOKEN_UAT" || {
            echo "Missing GitHub secret FIREBASE_TOKEN_UAT"
            exit 1
          }

      - name: Build Firebase Hosting bundle
        run: |
          bun install --frozen-lockfile
          bun run build:uat

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN_UAT: ${{ secrets.FIREBASE_TOKEN_UAT }}
        run: |
          npx --yes firebase-tools@latest deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only hosting \
            --token "$FIREBASE_TOKEN_UAT" \
            --non-interactive
