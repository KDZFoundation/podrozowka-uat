name: Quality Gate

on:
  push:
    branches:
      - main
      - uat
      - production
  pull_request:
    branches:
      - main
      - uat
      - production

# Zasada najmniejszych uprawnień - Quality Gate tylko czyta repo
permissions:
  contents: read

# Anuluje poprzedni run na tym samym branchu/PR, jeśli wpadnie nowy push
# (oszczędza minuty CI przy szybkich commitach z AI Studio)
concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        env:
          # Sekrety per środowisko - skonfigurować w Settings > Secrets and variables > Actions
          # Nazwy przykładowe, dopasuj do faktycznych zmiennych używanych przez aplikację
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # github.ref_name dla eventu pull_request wskazuje na tymczasową
          # referencję mergea (np. "123/merge"), NIE na branch docelowy.
          # Dla PR-ów trzeba użyć github.base_ref, żeby zbudować z właściwą
          # konfiguracją środowiskową (dev/uat/prod).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          echo "Building for target branch: $TARGET_BRANCH"

          if [ "$TARGET_BRANCH" = "uat" ]; then
            npm run build:uat
          elif [ "$TARGET_BRANCH" = "production" ]; then
            npm run build:prod
          elif [ "$TARGET_BRANCH" = "main" ]; then
            npm run build:dev
          else
            npm run build
          fi